# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
theme: minimal-mistakes-jekyll
locale: en-US
title: "The AgStack Foundation"
description: "The AgStack Foundation is a Linux Foundation Project dedicated to open digital infrastructure for agriculture."
baseurl: # the subpath of your site, e.g. "/blog"
url: https://agstack.org # the base hostname & protocol for your site e.g. "https://mmistakes.github.io"
logo: "/assets/img/icon/color/agstack-icon-color.png"
masthead_title: "The AgStack Foundation"
date_format: "%B %-d, %Y"
last_updated: true
website_repo: https://github.com/agstack/agstack-website

# Copyright & Legal stuff
legal: true
owner: "The Linux Foundation"
trademark_policy: https://linuxfoundation.org/legal/trademark-usage
privacy_policy: https://www.linuxfoundation.org/legal/privacy-policy
terms_of_use: https://linuxfoundation.org/legal/terms
antitrust: https://www.linuxfoundation.org/legal/antitrust-policy
good_standing: https://www.linuxfoundation.org/legal/good-standing-policy
coc: https://events.linuxfoundation.org/about/code-of-conduct/ 

# Custom CSS
css: "/assets/css/agstack.css"

# Reading stuff for articles
read_time: # reading time estimates, e.g. true
words_per_minute: # 200

mathjax:
  enable: # MathJax equations, e.g. true, false (default)
  combo:  # "tex-svg" (default), "tex-mml-chtml", etc.: docs.mathjax.org/en/latest/web/components/combined.html
  tags:  # "none", "ams" (default), "all"
google_fonts:
  - name: "Source Sans Pro"
    weights: "400,400i,700,700i"
  - name: "Lora"
    weights: "400,400i,700,700i"

# Site Footer
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/agstack"


# Liquid
liquid:
  error_mode: strict

# Build settings
permalink: /:categories/:title/
markdown: kramdown
feed:
  path: atom.xml

# Search
search_full_content: false # can have performance implications for large sites

exclude:
  - archive
  - README.md
  - Gemfile
  - Gemfile.log
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/ 
include:
  - _pages
  - _projects

# Pagination with jekyll-paginate
paginate: 10 # number of posts to show
paginate_path: /page:num/

# Pagination with jekyll-paginate-v2
# See https://github.com/sverrirs/jekyll-paginate-v2/blob/master/README-GENERATOR.md#site-configuration
#   for configuration details
pagination:
  # Set enabled to true to use paginate v2
  enabled: false
  debug: false
  collection: 'posts'
  per_page: 10
  permalink: '/page/:num/'
  title: ':title - page :num'
  limit: 0
  sort_field: 'date'
  sort_reverse: true
  category: 'posts'
  tag: ''
  locale: ''
  trail:
    before: 2
    after: 2

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-paginate
  - jekyll-include-cache

# Front Matter Defaults
defaults:
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      classes: wide
  - scope:
      path: "_projects"
      type: projects
    values:
      layout: single
      classes: wide

# Site Author
author:
  name:
  picture:
  email:
  twitter:
  links:
    - title:
      url:
      icon:

# Footer Links
footer_links:
  - title: Feed
    url: atom.xml
    icon: fas fa-rss-square